<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简洁网页</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Microsoft YaHei", Arial, sans-serif;
        background: linear-gradient(135deg, #eef6ff, #f8f9ff 35%, #fdf2f8);
        color: #1f2937;
      }

      .container {
        max-width: 980px;
        margin: 48px auto;
        padding: 24px;
      }

      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 28px 32px;
        background: rgba(255, 255, 255, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 22px;
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.08);
        backdrop-filter: blur(8px);
      }

      .title-wrap h1 {
        margin: 0;
        font-size: 2rem;
      }

      .title-wrap p {
        margin: 8px 0 0;
        color: #6b7280;
      }

      .badge {
        padding: 10px 18px;
        border-radius: 999px;
        background: linear-gradient(135deg, #4f46e5, #8b5cf6);
        color: white;
        font-weight: 600;
        box-shadow: 0 10px 24px rgba(99, 102, 241, 0.25);
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 20px;
        margin-top: 28px;
      }

      .card {
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
      }

      .card h2 {
        margin-top: 0;
        font-size: 1.2rem;
      }

      .card p {
        margin: 0;
        line-height: 1.7;
        color: #475569;
      }

      .note-list {
        margin-top: 28px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 20px;
        padding: 22px;
        box-shadow: 0 14px 30px rgba(15, 23, 42, 0.06);
      }

      .note-list h3 {
        margin: 0 0 16px;
      }

      ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }

      li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        margin-bottom: 12px;
      }

      .check {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid #8b5cf6;
        display: inline-block;
      }

      .tag {
        font-size: 0.78rem;
        color: #7c3aed;
        background: #f3e8ff;
        border-radius: 999px;
        padding: 6px 10px;
      }

      .footer {
        text-align: center;
        margin-top: 24px;
        color: #64748b;
        font-size: 0.95rem;
      }

      .button {
        margin-top: 18px;
        display: inline-block;
        border: none;
        border-radius: 12px;
        padding: 12px 18px;
        background: linear-gradient(135deg, #10b981, #3b82f6);
        color: white;
        font-size: 0.95rem;
        cursor: pointer;
        box-shadow: 0 10px 25px rgba(59, 130, 246, 0.22);
      }

      @media (max-width: 640px) {
        .header {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="title-wrap">
          <h1>欢迎来到我的页面</h1>
          <p>简单、清晰、适合展示内容</p>
        </div>
        <div class="badge">Live Demo</div>
      </header>

      <section class="grid">
        <article class="card">
          <h2>关于</h2>
          <p>这是一份简洁的静态网页示例，适合学习 HTML + CSS 的基础布局。</p>
        </article>

        <article class="card">
          <h2>特点</h2>
          <p>响应式布局、舒适配色、清晰结构，方便二次开发和扩展。</p>
        </article>

        <article class="card">
          <h2>用途</h2>
          <p>可以作为个人介绍页、待办页、信息展示页或启动页面。</p>
        </article>
      </section>

      <section class="note-list">
        <h3>今日任务</h3>
        <ul>
          <li>
            <span><span class="check"></span> 完成页面结构设计</span>
            <span class="tag">已完成</span>
          </li>
          <li>
            <span><span class="check"></span> 调整页面样式</span>
            <span class="tag">已完成</span>
          </li>
          <li>
            <span><span class="check"></span> 预览并优化细节</span>
            <span class="tag">进行中</span>
          </li>
        </ul>
        <button class="button" type="button">添加提醒</button>
      </section>

      <div class="footer">© 2026 Simple Web Page</div>
    </div>
  </body>
</html>
