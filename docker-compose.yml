services:
  noteshell-server:
    build: .
    image: noteshell-server:latest
    container_name: noteshell-server
    restart: unless-stopped
    ports:
      # 宿主机端口 -> 容器 8001（NOTESHELL_PORT）
      - "8001:8001"
    volumes:
      # 笔记本数据持久化：宿主机 ./data/ <-> 容器 /data/
      # 数据目录: /data/.noteshell_data/
      - ./data:/data
    environment:
      - NOTESHELL_HOST=0.0.0.0
      - NOTESHELL_PORT=8001
      - TZ=Asia/Shanghai
